spring.application.name=backend
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:3306/${MYSQL_DATABASE:kanji}
spring.datasource.username=${MYSQL_USER:kanji}
spring.datasource.password=${MYSQL_PASSWORD:kanjipass}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
